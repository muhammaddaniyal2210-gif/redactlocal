<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>RedactLocal</title>
  <!-- A ground of its own: browser tabs, bookmark bars and app grids each paint
       their own backdrop, and the muted lines would disappear against a dark
       one if the mark were transparent. -->
  <rect width="48" height="48" rx="11" fill="#020617"/>
  <rect x="9" y="13" width="21" height="4.2" rx="2.1" fill="#475569"/>
  <rect x="9" y="21.4" width="30" height="8.4" rx="2.4" fill="#34d399"/>
  <rect x="9" y="33.8" width="15" height="4.2" rx="2.1" fill="#475569"/>
</svg>
