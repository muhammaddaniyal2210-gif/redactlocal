<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1400" height="980" fill="#ffffff"/>

  <!-- header -->
  <text x="90" y="150" fill="#0f172a" font-size="40" font-weight="700" letter-spacing="-0.5">CONFIDENTIAL — CLIENT RECORD</text>
  <rect x="90" y="196" width="520" height="10" rx="5" fill="#e2e8f0"/>

  <!-- Name: normal line -->
  <text x="90" y="330" fill="#334155" font-size="30">Name:</text>
  <text x="300" y="330" fill="#0f172a" font-size="30" font-weight="600">Jordan Ellery</text>

  <!-- SSN: properly redacted (solid) -->
  <text x="90" y="430" fill="#334155" font-size="30">SSN:</text>
  <rect x="300" y="404" width="300" height="40" rx="5" fill="#0b1220"/>

  <!-- Account: the "redacted" box the text still shows through -->
  <text x="90" y="560" fill="#334155" font-size="30">Account no.:</text>
  <!-- the real number, in red mono -->
  <text x="300" y="560" fill="#dc2626" font-size="34" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="2">5012 8847 1930</text>
  <!-- a black "redaction" box over it — but semi-transparent, so it does not hide anything -->
  <rect x="294" y="528" width="330" height="44" rx="5" fill="#0b1220" opacity="0.5"/>
  <!-- callout -->
  <g transform="translate(660,538)">
    <rect x="0" y="0" width="250" height="40" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="22" y="27" fill="#dc2626" font-size="20" font-weight="700">⚠ still readable</text>
  </g>

  <!-- DOB: another solid redaction -->
  <text x="90" y="690" fill="#334155" font-size="30">Date of birth:</text>
  <rect x="340" y="664" width="240" height="40" rx="5" fill="#0b1220"/>

  <!-- footer note lines -->
  <rect x="90" y="790" width="760" height="9" rx="4.5" fill="#eef2f7"/>
  <rect x="90" y="826" width="620" height="9" rx="4.5" fill="#eef2f7"/>
</svg>
