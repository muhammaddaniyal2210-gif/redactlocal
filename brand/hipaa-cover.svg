<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="957" viewBox="0 0 1600 957" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1326"/>
      <stop offset="0.55" stop-color="#060c1c"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1e3a8a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#059669" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="shieldFill" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#0f2a24"/>
      <stop offset="1" stop-color="#0a1a1c"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#334155" fill-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1600" height="957" fill="url(#bg)"/>
  <rect width="1600" height="957" fill="url(#dots)"/>

  <!-- cinematic light: cool key from upper-left, warm-green rim lower-right -->
  <ellipse cx="430" cy="250" rx="620" ry="470" fill="url(#blueGlow)" filter="url(#soft)"/>
  <ellipse cx="1230" cy="770" rx="560" ry="430" fill="url(#greenGlow)" filter="url(#soft)"/>

  <!-- eyebrow -->
  <text x="800" y="150" text-anchor="middle" fill="#5eead4" font-size="21" font-weight="600" letter-spacing="4">PROTECTED HEALTH INFORMATION · STAYS ON DEVICE</text>

  <!-- the record card -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="250" width="480" height="470" rx="22" fill="url(#card)"/>
    <rect x="560" y="250" width="480" height="470" rx="22" fill="none" stroke="url(#cardEdge)" stroke-width="1.5"/>
    <!-- top light seam -->
    <rect x="561" y="251" width="478" height="2" rx="1" fill="#ffffff" fill-opacity="0.06"/>

    <!-- header: medical cross badge + provider line -->
    <rect x="596" y="292" width="52" height="52" rx="13" fill="#0e2a24" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <g fill="url(#emerald)">
      <rect x="618" y="302" width="8" height="32" rx="4"/>
      <rect x="606" y="314" width="32" height="8" rx="4"/>
    </g>
    <rect x="668" y="300" width="150" height="13" rx="6.5" fill="#334155"/>
    <rect x="668" y="324" width="96" height="11" rx="5.5" fill="#1e293b"/>

    <!-- body lines, two of them redacted, one emerald live-mask -->
    <rect x="596" y="384" width="408" height="14" rx="7" fill="#1b2740"/>
    <rect x="596" y="418" width="250" height="14" rx="7" fill="#0a1120"/>            <!-- redacted -->
    <rect x="860" y="418" width="80" height="14" rx="7" fill="#1b2740"/>
    <rect x="596" y="452" width="408" height="14" rx="7" fill="#1b2740"/>
    <rect x="596" y="486" width="150" height="14" rx="7" fill="#0a1120"/>            <!-- redacted -->
    <rect x="760" y="486" width="120" height="14" rx="7" fill="#1b2740"/>
    <rect x="596" y="520" width="300" height="14" rx="7" fill="#1b2740"/>

    <!-- the live partial-mask row: emerald bar with a readable tail -->
    <rect x="596" y="566" width="150" height="30" rx="8" fill="url(#emerald)"/>
    <text x="756" y="588" fill="#5eead4" font-size="20" font-weight="700" letter-spacing="3" font-family="monospace">••7431</text>
    <rect x="596" y="616" width="360" height="12" rx="6" fill="#141f36"/>
    <rect x="596" y="642" width="270" height="12" rx="6" fill="#141f36"/>
  </g>

  <!-- shield + check, overlapping the card's lower-right, emerald glow -->
  <g transform="translate(946,556)">
    <path d="M74 0 L142 26 V80 C142 128 112 158 74 176 C36 158 6 128 6 80 V26 Z"
          fill="url(#shieldFill)" stroke="url(#emerald)" stroke-width="3" filter="url(#glow)"/>
    <path d="M74 0 L142 26 V80 C142 128 112 158 74 176 C36 158 6 128 6 80 V26 Z"
          fill="none" stroke="url(#emerald)" stroke-width="3"/>
    <path d="M46 86 L66 108 L104 62" fill="none" stroke="#34d399" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- headline -->
  <text x="800" y="812" text-anchor="middle" fill="#f1f5f9" font-size="52" font-weight="700" letter-spacing="-1.2">The record never leaves the device.</text>
  <text x="800" y="856" text-anchor="middle" fill="#94a3b8" font-size="24" font-weight="400">HIPAA-minded PDF redaction, entirely in your browser.</text>

  <!-- wordmark -->
  <g transform="translate(724,896)">
    <rect x="0" y="10" width="26" height="6" rx="3" fill="#475569"/>
    <rect x="0" y="1" width="34" height="8" rx="3" fill="#34d399"/>
    <rect x="0" y="19" width="19" height="6" rx="3" fill="#475569"/>
    <text x="46" y="21" fill="#e2e8f0" font-size="22" font-weight="600" letter-spacing="-0.4">Redact<tspan fill="#34d399">Local</tspan></text>
  </g>
</svg>
