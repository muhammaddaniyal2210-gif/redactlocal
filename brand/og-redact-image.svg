<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="957" viewBox="0 0 1600 957" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1326"/><stop offset=".55" stop-color="#060c1c"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1d4ed8" stop-opacity=".5"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#10b981" stop-opacity=".45"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a6a"/><stop offset="1" stop-color="#3f6d6e"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#334155" fill-opacity=".16"/></pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>

  <rect width="1600" height="957" fill="url(#bg)"/>
  <rect width="1600" height="957" fill="url(#dots)"/>
  <ellipse cx="420" cy="230" rx="600" ry="440" fill="url(#g1)" filter="url(#soft)"/>
  <ellipse cx="1240" cy="770" rx="560" ry="420" fill="url(#g2)" filter="url(#soft)"/>

  <g transform="translate(646,70)">
    <rect x="0" y="9" width="26" height="4.6" rx="2.3" fill="#475569"/>
    <rect x="0" y="0" width="34" height="9.2" rx="2.6" fill="#34d399"/>
    <rect x="0" y="18" width="19" height="4.6" rx="2.3" fill="#475569"/>
    <text x="46" y="20" fill="#f1f5f9" font-size="25" font-weight="650" letter-spacing="-.4">Redact<tspan fill="#34d399">Local</tspan></text>
  </g>

  <text x="800" y="210" text-anchor="middle" fill="#f1f5f9" font-size="62" font-weight="700" letter-spacing="-1.4">Black out anything</text>
  <text x="800" y="282" text-anchor="middle" fill="#f1f5f9" font-size="62" font-weight="700" letter-spacing="-1.4">in a photo.</text>
  <text x="800" y="340" text-anchor="middle" fill="#94a3b8" font-size="25">Faces, names, plates — burned into the pixels, in your browser. Nothing uploaded.</text>

  <!-- photo with a face silhouette and a black redaction box over it -->
  <g filter="url(#sh)" transform="translate(560,410)">
    <rect x="0" y="0" width="480" height="400" rx="20" fill="url(#photo)"/>
    <!-- body silhouette -->
    <path d="M240 420 c0 -120 60 -180 0 -180 c-60 0 0 60 0 180 Z" fill="#1b3a46" fill-opacity=".6"/>
    <ellipse cx="240" cy="300" rx="150" ry="150" fill="#24506a" fill-opacity=".55"/>
    <!-- head -->
    <circle cx="240" cy="150" r="78" fill="#3f6d80"/>
    <!-- black redaction box over the face -->
    <rect x="150" y="96" width="180" height="108" rx="6" fill="#000"/>
  </g>

  <!-- pixelate alt swatch -->
  <g transform="translate(1070,470)">
    <text x="0" y="-14" fill="#64748b" font-size="18" font-weight="600" letter-spacing="2">OR PIXELATE</text>
    <g>
      <rect x="0" y="0" width="30" height="30" fill="#3f6d80"/><rect x="30" y="0" width="30" height="30" fill="#2b4a6a"/><rect x="60" y="0" width="30" height="30" fill="#4a7a6e"/>
      <rect x="0" y="30" width="30" height="30" fill="#2b4a6a"/><rect x="30" y="30" width="30" height="30" fill="#3f6d80"/><rect x="60" y="30" width="30" height="30" fill="#2b4a6a"/>
      <rect x="0" y="60" width="30" height="30" fill="#4a7a6e"/><rect x="30" y="60" width="30" height="30" fill="#2b4a6a"/><rect x="60" y="60" width="30" height="30" fill="#3f6d80"/>
    </g>
  </g>
</svg>
